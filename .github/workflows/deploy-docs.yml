name: Deploy DocC to GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DocC
        run: |
          xcrun docc convert SwiftFormat.docc \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path SwiftFormat

      - name: Add root redirect
        run: |
          cat > ./docs/index.html << 'REDIRECT'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=/SwiftFormat/documentation/swiftformat">
          </head>
          <body>
            <p>Redirecting to <a href="/SwiftFormat/documentation/swiftformat">documentation</a>…</p>
          </body>
          </html>
          REDIRECT

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
